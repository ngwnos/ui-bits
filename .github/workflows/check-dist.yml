name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dist-up-to-date:
    name: Dist, Lint, Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build Library
        run: bun --cwd packages/ui-bits build

      - name: Check Dist
        run: |
          git diff --name-only -- packages/ui-bits/dist
          git diff --exit-code -- packages/ui-bits/dist

      - name: Build Docs
        run: bun --cwd apps/docs build
